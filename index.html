<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1d24e3;--ink:#0a0c4d;--cream:#f4f0e2;--dim:rgba(244,240,226,.86)}
*{box-sizing:border-box}
html,body{background:var(--blue)}
body{margin:0;color:var(--cream);font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:54px 20px 90px;background:var(--blue)}
.kick{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
h1{font-family:"Anton",sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(46px,12vw,96px);line-height:.9;margin:6px 0 4px;text-shadow:4px 4px 0 var(--ink)}
.sub{color:var(--dim);font-family:"Space Mono",monospace;font-size:13px;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
/* ===== PROJECT CARD — copy this block to add a new project, change the href + text ===== */
.card{display:block;text-decoration:none;background:var(--cream);color:var(--ink);border-radius:4px;
  padding:18px 18px 20px;box-shadow:5px 5px 0 rgba(10,12,77,.30);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:8px 8px 0 rgba(10,12,77,.42)}
.card .tag{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);background:var(--blue);padding:2px 7px;border-radius:2px}
.card .ttl{font-family:"Anton",sans-serif;font-weight:400;text-transform:uppercase;font-size:27px;line-height:1;color:var(--blue);margin:12px 0 6px}
.card .desc{font-size:14.5px;line-height:1.5;color:#1a1f63}
.card .go{display:inline-block;margin-top:12px;font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.06em;color:var(--blue)}
/* ===== end card ===== */
footer{margin-top:34px;font-family:"Space Mono",monospace;font-size:11.5px;color:var(--dim);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="kick">Built with Claude</div>
  <h1>Projects</h1>
  <div class="sub">A home for one-off pages, tools &amp; experiments.</div>

  <div class="grid">

    <!-- PROJECT: Portola 2026 -->
    <a class="card" href="portola-2026/">
      <span class="tag">Music · Festival</span>
      <div class="ttl">Portola 2026</div>
      <div class="desc">Full lineup with Spotify links, top tracks, DJ SoundCloud sets, and what makes each set unique.</div>
      <span class="go">Open →</span>
    </a>

    <!--
    To add another project later, copy the block below, drop it above this comment,
    and point href at the new folder you upload (e.g. href="my-next-thing/"):

    <a class="card" href="FOLDER-NAME/">
      <span class="tag">CATEGORY</span>
      <div class="ttl">PROJECT TITLE</div>
      <div class="desc">One line about it.</div>
      <span class="go">Open →</span>
    </a>
    -->

  </div>

  <footer>Each project lives in its own folder. The folder name is its web address.</footer>
</div>
</body>
</html>
